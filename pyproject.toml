[project]
name = "raw-footage-still-extractor"
version = "0.1.1"
description = "Fast, parallel CLI that pulls five 300px JPEG stills from every video in a deep footage tree, then builds a browsable two-pane HTML gallery."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sergiu Brega", email = "81160254+sergiubrega@users.noreply.github.com" },
]
keywords = [
    "ffmpeg",
    "ffprobe",
    "video",
    "stills",
    "thumbnails",
    "contact-sheet",
    "mxf",
    "b-roll",
    "media-management",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
raw-footage-still-extractor = "still_extractor:main"
raw-footage-still-gallery = "still_extractor.gallery:main"

[project.urls]
Repository = "https://github.com/sergiubrega/raw-footage-still-extractor"
Issues = "https://github.com/sergiubrega/raw-footage-still-extractor/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

# Flat layout: the package sits at the repo root, not under src/.
# module-name is required because the package name (still_extractor) differs
# from the distribution name (raw-footage-still-extractor).
[tool.uv.build-backend]
module-root = ""
module-name = "still_extractor"
