name: Publish to PyPI

# Uses PyPI Trusted Publishing (OIDC) — no API token or secret is stored.
# One-time setup on PyPI (see README "Releasing"):
#   PyPI > Account > Publishing > Add a pending publisher
#     PyPI project name : raw-footage-still-extractor
#     Owner             : sergiubrega
#     Repository name   : raw-footage-still-extractor
#     Workflow name     : publish.yml
#     Environment name  : pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/raw-footage-still-extractor
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
