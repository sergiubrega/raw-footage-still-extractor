name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  # The tool targets Apple Silicon, so exercise the real platform too.
  test-macos:
    name: tests (macOS / Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Run tests
        run: uv run pytest -q

  build:
    name: build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - name: Check the wheel metadata
        run: |
          python3 - <<'PY'
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          meta = zipfile.ZipFile(wheel).read(
              [n for n in zipfile.ZipFile(wheel).namelist() if n.endswith("METADATA")][0]
          ).decode()
          assert "License-Expression: MIT" in meta, "license metadata missing"
          assert "Description-Content-Type: text/markdown" in meta, "README not attached"
          print("wheel metadata OK")
          PY
